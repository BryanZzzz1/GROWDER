<ion-content class="ion-padding login-content">
  <ion-button fill="clear" class="view-back" routerLink="/iniciotienda" aria-label="Volver al inicio"><ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon></ion-button>
  <div class="login-container">
    <img src="../../assets/icon/logocircular.png" alt="Logo" class="logo" />

    <span class="login-kicker">BIENVENIDO DE VUELTA</span>
    <h1 class="login-title">Iniciar sesión</h1>
    <p class="login-subtitle">Entra para guardar tus productos y continuar donde lo dejaste.</p>

    <ion-item>
      <ion-label position="floating">Correo Electrónico</ion-label>
      <ion-input [(ngModel)]="email" required type="email"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input [(ngModel)]="password" required type="password"></ion-input>
    </ion-item>

    <ion-button expand="full" (click)="onLogin()" class="login-button"><ion-icon name="arrow-forward-outline" slot="end"></ion-icon>Iniciar sesión</ion-button>

    <div class="link-container">
      <ion-button expand="full" routerLink="/register" class="register-button">Crear Cuenta</ion-button>
      <ion-button expand="full" color="light" routerLink="/change-password">¿Olvidaste tu Contraseña?</ion-button>
    </div>
  </div>
</ion-content>
