<ion-content class="ion-padding login-content">
  <ion-button fill="clear" class="view-back" routerLink="/iniciotienda" aria-label="Volver al inicio">
    <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
  </ion-button>
  
  <div class="login-container">
    <img src="../../assets/icon/logocircular.png" alt="Logo" class="logo" />

    <span class="login-kicker">BIENVENIDO DE VUELTA</span>
    <h1 class="login-title brand-serif">Iniciar sesión</h1>
    <p class="login-subtitle">Entra para guardar tus productos y continuar donde lo dejaste.</p>

    <div class="form-group">
      <input class="custom-input" type="email" [(ngModel)]="email" placeholder="Correo electrónico" required />
    </div>

    <div class="form-group">
      <input class="custom-input" type="password" [(ngModel)]="password" placeholder="Contraseña" required />
    </div>

    <button class="btn-primary login-button" (click)="onLogin()">
      Iniciar sesión <ion-icon name="arrow-forward-outline"></ion-icon>
    </button>

    <div class="link-container">
      <button class="btn-outline register-button" routerLink="/register">CREAR CUENTA</button>
      <a class="forgot-link" (click)="abrirModalRecuperacion()">¿Olvidaste tu contraseña?</a>
    </div>
  </div>

  <!-- Contenedor / Modal de Olvido de Contraseña -->
  <div class="recovery-overlay fade-in" *ngIf="mostrarModalRecuperacion">
    <div class="recovery-modal-card">
      
      <!-- Botón Volver / Cerrar -->
      <button type="button" class="btn-close-modal" (click)="cerrarModalRecuperacion()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>

      <!-- Cabecera -->
      <div class="modal-header text-center">
        <div class="modal-icon-badge">
          <ion-icon name="mail-unread-outline"></ion-icon>
        </div>
        <span class="modal-badge-subtitle">Restablecimiento seguro</span>
        <h2 class="serif-modal-title">¿Olvidaste tu contraseña?</h2>
        <p class="modal-desc">
          No te preocupes. Escribe tu correo electrónico y te enviaremos un enlace seguro para crear una nueva.
        </p>
      </div>

      <!-- Formulario de Envío -->
      <form (ngSubmit)="enviarEnlaceRecuperacion()" class="modal-form">
        <div class="input-block">
          <label class="field-label">Correo electrónico</label>
          <div class="input-wrapper">
            <ion-icon name="mail-outline" class="input-left-icon"></ion-icon>
            <input 
              type="email" 
              [(ngModel)]="emailRecuperacion" 
              name="emailRecuperacion"
              placeholder="ejemplo@correo.com"
              required
              class="styled-input with-left-icon" />
          </div>
        </div>

        <!-- Botón de Acción -->
        <button 
          type="submit" 
          class="btn-action-primary mt-4" 
          [disabled]="!emailRecuperacion || enviandoCorreo">
          <span *ngIf="!enviandoCorreo">Enviar enlace de acceso</span>
          <ion-spinner *ngIf="enviandoCorreo" name="crescent" class="btn-spinner"></ion-spinner>
        </button>

        <!-- Cancelar / Volver al login -->
        <button 
          type="button" 
          class="btn-text-secondary mt-3" 
          (click)="cerrarModalRecuperacion()">
          Volver a Iniciar Sesión
        </button>
      </form>

    </div>
  </div>
</ion-content>
