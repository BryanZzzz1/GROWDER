<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title></ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding login-content">
  <div class="login-container">
    <img src="../../assets/img/image_4_1.png" alt="Logo" class="logo" />

    <h2 class="login-title" style="font-family: Impact;">Iniciar Sesión</h2>

    <ion-item>
      <ion-label position="floating">Correo Electrónico</ion-label>
      <ion-input [(ngModel)]="email" required type="email"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input [(ngModel)]="password" required type="password"></ion-input>
    </ion-item>

    <ion-button expand="full" (click)="onLogin()" class="login-button">Iniciar Sesión</ion-button>

    <div class="link-container">
      <ion-button expand="full" routerLink="/register" class="register-button">Crear Cuenta</ion-button>
      <ion-button expand="full" color="light" routerLink="/change-password">¿Olvidaste tu Contraseña?</ion-button>
    </div>
  </div>
</ion-content>
