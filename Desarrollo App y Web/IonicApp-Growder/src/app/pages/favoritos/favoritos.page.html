<ion-content [fullscreen]="true" class="fav-content">
  <main class="fav-shell">
    <button class="back-btn" (click)="volver()"><ion-icon name="arrow-back-outline"></ion-icon><span>VOLVER</span></button>
    <h1 class="brand-serif">Mis Favoritos</h1>
    <p class="sub">Los productos que guardaste, solo visibles para ti.</p>

    <div *ngIf="cargando" class="center"><ion-spinner name="crescent" color="primary"></ion-spinner></div>

    <div class="product-grid" *ngIf="!cargando && productos.length">
      <article class="product-card" *ngFor="let producto of productos" (click)="ver(producto)">
        <div class="image-wrapper">
          <img [src]="producto.foto || 'assets/img/placeholder.svg'" [alt]="producto.nombre" (error)="$any($event.target).src = 'assets/img/placeholder.svg'" />
          <button class="fav-btn active" (click)="quitar(producto, $event)" aria-label="Quitar de favoritos">
            <ion-icon name="heart"></ion-icon>
          </button>
        </div>
        <div class="product-info">
          <h4 class="product-title">{{ producto.nombre }}</h4>
          <div class="price-row">
            <span class="price">${{ producto.precio | number:'1.0-0' }}</span>
            <button class="add-btn" (click)="agregar(producto, $event)"><ion-icon name="add"></ion-icon></button>
          </div>
        </div>
      </article>
    </div>

    <div class="empty-state" *ngIf="!cargando && !productos.length">
      <ion-icon name="heart-outline"></ion-icon>
      <h3 class="brand-serif">Aún no tienes favoritos</h3>
      <p>Toca el corazón de un producto para guardarlo aquí.</p>
      <button class="cta" (click)="irTienda()">Explorar catálogo</button>
    </div>
  </main>
</ion-content>
