<ion-content class="ion-padding bg-main">
  <div class="container-wrapper">

    <!-- ESTADO 1: Sincronizando (Loader) -->
    <div *ngIf="estado === 'sincronizando'" class="card-box text-center">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
      <h2 class="title-serif mt-3">Sincronizando enlace...</h2>
      <p class="subtitle-text">Validando el código de seguridad con la sesión para habilitar el cambio de contraseña.</p>
    </div>

    <!-- ESTADO 2: Error de Sincronización -->
    <div *ngIf="estado === 'error'" class="card-box text-center">
      <div class="error-badge mb-3">Enlace no válido</div>
      <h2 class="title-serif">No se pudo verificar el código</h2>
      <p class="subtitle-text">{{ mensajeError }}</p>
      <button class="btn-primary mt-4" (click)="volverAlLogin()">
        Volver a Iniciar Sesión
      </button>
    </div>

    <!-- ESTADO 3: Listo (Formulario de cambio activo) -->
    <div *ngIf="estado === 'listo'" class="card-box">
      <h2 class="title-serif text-center">Crear Nueva Contraseña</h2>
      <p class="subtitle-text text-center">Ingresa y confirma tu nueva clave de acceso.</p>

      <div class="form-group mt-4">
        <label class="input-label">Nueva Contraseña</label>
        <div class="input-wrapper">
          <input 
            [type]="mostrarNuevaPassword ? 'text' : 'password'" 
            [(ngModel)]="nuevaPassword" 
            placeholder="Mínimo 6 caracteres"
            class="custom-input" />
          <ion-icon 
            [name]="mostrarNuevaPassword ? 'eye-off-outline' : 'eye-outline'" 
            class="eye-icon" 
            (click)="toggleMostrarNueva()"></ion-icon>
        </div>
      </div>

      <div class="form-group mt-3">
        <label class="input-label">Confirmar Nueva Contraseña</label>
        <div class="input-wrapper">
          <input 
            [type]="mostrarConfirmarPassword ? 'text' : 'password'" 
            [(ngModel)]="confirmarPassword" 
            placeholder="Repite la contraseña"
            class="custom-input" />
          <ion-icon 
            [name]="mostrarConfirmarPassword ? 'eye-off-outline' : 'eye-outline'" 
            class="eye-icon" 
            (click)="toggleMostrarConfirmar()"></ion-icon>
        </div>
      </div>

      <!-- Checklist de validación visual -->
      <div class="validation-checklist mt-3">
        <div class="check-item" [ngClass]="{'valid': tieneMinimoCaracteres}">
          <ion-icon [name]="tieneMinimoCaracteres ? 'checkmark-circle' : 'ellipse-outline'"></ion-icon>
          <span>Mínimo 6 caracteres</span>
        </div>
        <div class="check-item" [ngClass]="{'valid': coincidenPasswords}">
          <ion-icon [name]="coincidenPasswords ? 'checkmark-circle' : 'ellipse-outline'"></ion-icon>
          <span>Las contraseñas coinciden</span>
        </div>
      </div>

      <button 
        class="btn-primary mt-4 w-100" 
        [disabled]="!formularioValido" 
        (click)="actualizarContrasena()">
        <span *ngIf="!actualizando">Actualizar e Iniciar Sesión</span>
        <ion-spinner *ngIf="actualizando" name="dots"></ion-spinner>
      </button>
    </div>

  </div>
</ion-content>
