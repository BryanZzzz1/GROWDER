<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/user-profile" text="" icon="arrow-back"></ion-back-button>
    </ion-buttons>
    <ion-title class="brand-serif">Editar Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="edit-content">
  <main class="edit-shell">
    
    <section class="edit-intro">
      <span class="edit-kicker">TU INFORMACIÓN</span>
      <h1 class="brand-serif">Hazlo más tuyo.</h1>
      <p>Actualiza tus datos y mantén tu cuenta al día.</p>
    </section>

    <section class="edit-card">
      <div class="photo-row">
        <ion-avatar>
          <img [src]="user.foto || 'https://docs-demo.ionic.io/assets/madison.jpg'" alt="Foto de perfil" />
        </ion-avatar>
        <div>
          <strong>Foto de perfil</strong>
          <small>Una imagen ayuda a reconocerte</small>
          <ion-button fill="clear" (click)="takePhoto()">
            <ion-icon name="camera-outline" slot="start"></ion-icon>
            Cambiar foto
          </ion-button>
        </div>
      </div>

      <div class="form-group">
        <label>Nombre de usuario</label>
        <div class="input-wrapper">
          <input class="custom-input" type="text" [(ngModel)]="user.username" placeholder="Nombre completo o apodo" />
        </div>
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <div class="input-wrapper">
          <input class="custom-input" type="tel" [(ngModel)]="user.telefono" placeholder="+56 9 1234 5678" />
        </div>
      </div>

      <div class="form-group">
        <label>Fecha de nacimiento</label>
        <div class="input-wrapper">
          <input class="custom-input" type="date" [(ngModel)]="user.fecha_nacimiento" />
        </div>
      </div>

      <ion-button expand="block" (click)="guardarCambiosPerfil()" class="btn-guardar-perfil btn-primary">
        Guardar Cambios
      </ion-button>
    </section>

  </main>
</ion-content>
