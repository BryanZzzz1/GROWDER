<ion-content [fullscreen]="true" class="profile-content"><main class="profile-shell"><ion-button fill="clear" class="view-back" routerLink="/tienda" aria-label="Volver a la tienda"><ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon></ion-button><section class="profile-hero"><ion-avatar class="profile-avatar"><img [src]="foto || 'https://docs-demo.ionic.io/assets/madison.jpg'" alt="Foto de perfil" /></ion-avatar><div><span class="profile-kicker">CUENTA GROWDER</span><h1>{{ email }}</h1><p>Administra tus datos, compras y preferencias.</p></div></section><section class="profile-grid"><article class="profile-card"><span class="profile-kicker">INFORMACIÓN PERSONAL</span><div class="profile-data"><div><small>Teléfono</small><strong>{{ telefono || 'No especificado' }}</strong></div><div><small>Fecha de nacimiento</small><strong>{{ fechaNacimiento }}</strong></div></div><ion-button expand="block" class="profile-primary" (click)="editarperfil()"><ion-icon name="create-outline" slot="start"></ion-icon>Editar perfil</ion-button></article><article class="profile-card profile-actions"><span class="profile-kicker">ACCIONES RÁPIDAS</span><button type="button" (click)="cambiarContrasena()"><ion-icon name="lock-closed-outline"></ion-icon><span><strong>Cambiar contraseña</strong><small>Protege el acceso a tu cuenta</small></span><ion-icon name="chevron-forward-outline"></ion-icon></button><button type="button" (click)="irHistorialCompras()"><ion-icon name="receipt-outline"></ion-icon><span><strong>Historial de compras</strong><small>Revisa tus pedidos anteriores</small></span><ion-icon name="chevron-forward-outline"></ion-icon></button><button type="button" class="logout-action" (click)="logout()"><ion-icon name="log-out-outline"></ion-icon><span><strong>Cerrar sesión</strong><small>Salir de esta cuenta</small></span><ion-icon name="chevron-forward-outline"></ion-icon></button></article></section><div class="footer-spacing"></div></main></ion-content>
