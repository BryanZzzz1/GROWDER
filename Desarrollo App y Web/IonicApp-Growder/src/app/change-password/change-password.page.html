<ion-content [fullscreen]="true" class="password-content"><main class="password-shell"><ion-button fill="clear" class="view-back" routerLink="/login" aria-label="Volver al login"><ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon></ion-button><section class="password-intro"><span class="form-kicker">CUENTA GROWDER</span><h1>Volvamos a entrar.</h1><p>Te enviaremos un enlace seguro para recuperar tu acceso. El cambio de contraseña se realiza desde tu perfil cuando tienes una sesión activa.</p></section><section class="password-card"><div class="form-stack"><ion-input label="Correo electrónico" label-placement="stacked" type="email" fill="outline" [(ngModel)]="email" placeholder="tu@correo.com"></ion-input><ion-button expand="block" class="form-primary" (click)="enviarRecuperacion()">Enviar enlace <ion-icon name="mail-outline" slot="end"></ion-icon></ion-button></div></section></main></ion-content>
